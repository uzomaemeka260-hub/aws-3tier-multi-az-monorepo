name: Zero-Failure Portfolio Pipeline (GHCR Target)
on:
  push:
    branches: [ main ]

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build React App
        run: |
          cd frontend
          npm install
          npm run build

      - name: Upload React Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: frontend/build

  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}/app-backend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Download React Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: react-build

      - name: Upload Frontend Build to S3
        run: aws s3 sync react-build/ s3://uzoma-enterprise-tf-state-bucket-unique/frontend-build/ --delete

      - name: Deploy Frontend to Nginx Instances
        run: |
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names asg-nginx \
            --query "AutoScalingGroups[0].Instances[*].InstanceId" \
            --output text)

          for INSTANCE_ID in $INSTANCE_IDS; do
            echo "Waiting for SSM on $INSTANCE_ID..."
            aws ssm wait command-executed \
              --command-id $(aws ssm send-command \
                --instance-ids "$INSTANCE_ID" \
                --document-name "AWS-RunShellScript" \
                --parameters commands=["echo ready"] \
                --region us-east-1 \
                --query "Command.CommandId" \
                --output text) \
              --instance-id "$INSTANCE_ID" \
              --region us-east-1 2>/dev/null || true

            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters commands=["aws s3 sync s3://uzoma-enterprise-tf-state-bucket-unique/frontend-build/ /usr/share/nginx/html/ --delete","systemctl reload nginx"] \
              --region us-east-1
          done

      - name: Deploy Backend to ASG Instances
        run: |
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names asg-backend \
            --query "AutoScalingGroups[0].Instances[*].InstanceId" \
            --output text)

          for INSTANCE_ID in $INSTANCE_IDS; do
            echo "Waiting for SSM on $INSTANCE_ID..."
            aws ssm wait command-executed \
              --command-id $(aws ssm send-command \
                --instance-ids "$INSTANCE_ID" \
                --document-name "AWS-RunShellScript" \
                --parameters commands=["echo ready"] \
                --region us-east-1 \
                --query "Command.CommandId" \
                --output text) \
              --instance-id "$INSTANCE_ID" \
              --region us-east-1 2>/dev/null || true

            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters commands=["systemctl enable docker --now","docker stop backend || true","docker rm backend || true","docker pull ghcr.io/${{ github.repository }}/app-backend:latest","docker run -d --name backend --restart always -p 8080:8080 -e DB_HOST=${{ secrets.AWS_RDS_ENDPOINT }} -e DB_NAME=app_production -e DB_USER=dbadmin -e DB_PASSWORD=SecurePostgresPass123! ghcr.io/${{ github.repository }}/app-backend:latest"] \
              --region us-east-1
          done
