name: Zero-Failure Portfolio Pipeline (GHCR Target)
on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/app-frontend:latest

      - name: Package Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}/app-backend:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy Backend to ASG Instances
        run: |
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names asg-backend \
            --query "AutoScalingGroups[0].Instances[*].InstanceId" \
            --output text)

          for INSTANCE_ID in $INSTANCE_IDS; do
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters commands="[
                'sudo yum install -y docker',
                'sudo systemctl enable docker --now',
                'sudo docker stop backend || true',
                'sudo docker rm backend || true',
                'sudo docker pull ghcr.io/${{ github.repository }}/app-backend:latest',
                'sudo docker run -d --name backend --restart always -p 8080:8080 -e DB_HOST=${{ secrets.AWS_RDS_ENDPOINT }} -e DB_NAME=app_production -e DB_USER=dbadmin -e DB_PASSWORD=SecurePostgresPass123! ghcr.io/${{ github.repository }}/app-backend:latest'
              ]" \
              --region us-east-1
          done

      - name: Deploy Frontend to ASG Instances
        run: |
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names asg-nginx \
            --query "AutoScalingGroups[0].Instances[*].InstanceId" \
            --output text)

          for INSTANCE_ID in $INSTANCE_IDS; do
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters commands="[
                'sudo yum install -y docker',
                'sudo systemctl enable docker --now',
                'sudo docker stop frontend || true',
                'sudo docker rm frontend || true',
                'sudo docker pull ghcr.io/${{ github.repository }}/app-frontend:latest',
                'sudo docker run -d --name frontend --restart always -p 80:80 ghcr.io/${{ github.repository }}/app-frontend:latest'
              ]" \
              --region us-east-1
          done
